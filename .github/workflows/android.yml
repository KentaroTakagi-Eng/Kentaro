name: Android APK

on:
  push:
    paths:
      - "health-sync-android/**"
      - ".github/workflows/android.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: health-sync-android
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Build APK
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug
          cp app/build/outputs/apk/debug/app-debug.apk health-sync.apk

      - uses: actions/upload-artifact@v4
        with:
          name: health-sync-apk
          path: health-sync-android/health-sync.apk

      # スマホからダウンロードしやすいよう、Releases の「health-sync-latest」に最新APKを置く
      - name: Publish to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG=health-sync-latest
          NOTES="ブランチ ${GITHUB_REF_NAME} / ビルド #${GITHUB_RUN_NUMBER} / ${GITHUB_SHA::7}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" health-sync.apk --clobber
            gh release edit "$TAG" --notes "$NOTES"
          else
            gh release create "$TAG" health-sync.apk --title "Health→Notion 最新版" --notes "$NOTES" --prerelease --target "$GITHUB_SHA"
          fi
